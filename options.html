<!doctype html>
<html lang="en" data-brand="tabs">
<head>
<meta charset="utf-8">
<title>TrustyTabs – Saved names</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="popup.css">
<style>
  /* A full page, not a popup: the shared colours, header and controls, but a readable width and text size. */
  body { width: auto; max-width: 620px; margin: 0 auto; padding: 24px 24px 48px; gap: 12px; font-size: 13px; }
  header { margin: 0 -24px; padding: 0 24px 8px; }
  h1 { font-size: 16px; }
  #tools { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #tools[hidden] { display: none; } /* display: flex above would otherwise beat the hidden attribute */
  #tools .field { font-size: 13px; }
  #tools .btn { flex: none; }
  /* 12px = the field's padding (11px) + border (1px): the count and the names start where the text in the search field starts,
     and a row's hover box has the same edges as the field. */
  #count { margin: 0; padding-left: 12px; color: var(--muted); }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  #list li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; }
  #list li:hover { background: var(--soft); }
  .ico { width: 16px; height: 16px; flex: none; }
  .text { min-width: 0; flex: 1; }
  .name, .addr { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { font-weight: 600; }
  .addr { color: var(--muted); font-size: 11px; }
  #list .btn { flex: none; padding: 5px 10px; font-size: 11px; }
  #empty { margin: 8px 0; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>TrustyTabs – Saved names</h1>
    <button class="icon-btn" id="theme" type="button" title="Light or dark" aria-label="Switch light or dark theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div id="tools">
    <input id="q" class="field" type="search" placeholder="Search names and addresses" aria-label="Search saved names" spellcheck="false">
    <button id="clear" class="btn" type="button">Remove all</button>
  </div>
  <p id="count" role="status"></p>
  <ul id="list"></ul>
  <p id="empty" hidden>No saved names yet. Rename a tab and it shows up here.</p>
  <script src="icons.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
