<!doctype html>
<html lang="en" data-brand="tabs">
<head>
<meta charset="utf-8">
<title>TrustyTabs – Tab Renamer</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="popup.css">
<style>
  /* The rename box is the main action: ~14px of space below the header line and above the footer, equal on both sides. */
  #main { display: grid; gap: 8px; margin: 10px 0; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  footer { display: flex; justify-content: space-between; }
  /* No side padding: the two texts start and end on the same edges as the field and buttons above. */
  footer button { padding: 2px 0; font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; }
  footer button:hover { color: var(--fg); }
  #note { margin-top: 6px; } /* the status line is last, a little apart from the footer */
  /* Tab icon: a row that looks like the name field (same box, same 12px text inset) and opens the picker below it. */
  .pick { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 9px 11px; font: inherit;
    font-size: 12px; color: var(--fg); background: var(--soft); border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
  .pick:disabled { opacity: .5; cursor: default; }
  .pick .cur { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .pick img { width: 16px; height: 16px; }
  .pick .chev { width: 14px; height: 14px; transition: transform .15s; }
  .pick[aria-expanded="true"] .chev { transform: rotate(180deg); }
  /* Slides open by animating the row height 0fr -> 1fr (no fixed height, no scroll). The negative margin cancels the
     grid gap while closed, so the closed picker takes no space; the 4px inner padding keeps the colour ring from being clipped. */
  #picker { display: grid; grid-template-rows: 0fr; margin: -8px 0 0; opacity: 0; visibility: hidden;
    transition: grid-template-rows .28s cubic-bezier(.2, .8, .2, 1), margin .28s cubic-bezier(.2, .8, .2, 1),
      opacity .2s, visibility 0s .28s; }
  #picker.open { grid-template-rows: 1fr; margin: 0; opacity: 1; visibility: visible; transition-delay: 0s; }
  #picker .inner { display: grid; gap: 8px; min-height: 0; overflow: hidden; padding: 0 4px; margin: 0 -4px; }
  @media (prefers-reduced-motion: reduce) { #picker, #picker.open { transition: none; } }
  /* Margins (not padding) give the picker room above and below: inside the clipped box they shrink to 0 with the closed row. */
  .icons { margin-top: 8px; }
  .colors { display: flex; justify-content: space-between; padding: 4px 5px; margin-bottom: 8px; }
  .colors button { width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: var(--c); cursor: pointer; }
  .colors button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
  .icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .icons button { height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px;
    background: none; color: var(--c); cursor: pointer; }
  .icons button:hover { background: var(--soft); }
  .icons button[aria-checked="true"] { background: var(--c); color: #fff; }
  .icons .none { color: var(--muted); }
  .icons .none[aria-checked="true"] { background: var(--soft); color: var(--fg); }
  .icons svg { width: 17.6px; height: 17.6px; }
</style>
</head>
<body>
  <header>
    <h1>TrustyTabs – Tab Renamer</h1>
    <button class="icon-btn" id="theme" type="button" title="Light or dark" aria-label="Switch light or dark theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div id="main">
    <input id="name" class="field" placeholder="Tab name" autofocus spellcheck="false">
    <button id="iconbtn" class="pick" type="button" aria-expanded="false" aria-controls="picker">
      <span>Tab icon</span>
      <span class="cur"><span id="curtext">Site's own</span><img id="curimg" alt="" hidden>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div id="picker" inert>
      <div class="inner">
        <div class="icons" id="icons" role="radiogroup" aria-label="Icon"></div>
        <div class="colors" id="colors" role="radiogroup" aria-label="Icon colour"></div>
      </div>
    </div>
    <div class="row">
      <button id="reset" class="btn" type="button">Reset</button>
      <button id="save" class="btn primary" type="button">Save</button>
    </div>
  </div>
  <footer>
    <button id="saved" type="button" title="See and remove the names you saved">Saved names</button>
    <button id="shortcut" type="button" title="Change the shortcut">Shortcut: <span id="keys"></span></button>
  </footer>
  <p id="note" role="status" hidden></p>
  <script src="key.js"></script>
  <script src="icons.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
