<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="theme.js"></script>
  <style>
    :root {
      --bg: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7;
      --field: #f4f4f5; --accent: #4f46e5; --accent-fg: #ffffff; --warn: #dc2626;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; --line: #3f3f46;
      --field: #27272a; --accent: #818cf8; --accent-fg: #18181b; --warn: #f87171;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px 16px 12px; width: 300px;
      background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 13px; font-weight: 600; }
    button {
      font: inherit; color: inherit; cursor: pointer; background: transparent;
      border: 1px solid var(--line); border-radius: 8px; transition: background .15s, opacity .15s;
    }
    button:hover { background: var(--field); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { border: 0; padding: 4px; display: grid; place-items: center; color: var(--muted); }
    .icon:hover { color: var(--fg); }
    .icon svg { width: 16px; height: 16px; }
    :root[data-theme="dark"] .moon, :root[data-theme="light"] .sun { display: none; }
    input {
      width: 100%; padding: 9px 11px; font: inherit; color: inherit;
      background: var(--field); border: 1px solid transparent; border-radius: 8px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    input:disabled { opacity: .5; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { flex: 1; padding: 8px; font-weight: 500; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .primary:hover { background: var(--accent); opacity: .9; }
    footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    #shortcut { border: 0; padding: 2px 4px; color: var(--muted); font-size: 11px; }
    #shortcut:hover { color: var(--fg); background: transparent; }
    #note { margin-top: 10px; color: var(--warn); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Rename tab</h1>
    <button id="theme" class="icon" title="Switch theme" aria-label="Switch theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <input id="name" placeholder="Tab name" autofocus spellcheck="false">
  <div class="row">
    <button id="reset">Reset</button>
    <button id="save" class="primary">Save</button>
  </div>
  <div id="note" hidden></div>
  <footer><button id="shortcut" title="Change the shortcut">Shortcut: <span id="keys"></span></button></footer>
  <script src="key.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
